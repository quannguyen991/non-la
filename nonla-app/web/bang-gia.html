<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Price list — Nón Lá</title>
<meta name="description" content="A price list made by the seller, readable in your language before you order.">
<meta name="robots" content="noindex">
<link rel="icon" href="../icon.svg">
<!--
  Trang KHÁCH đọc bảng giá. Mở từ mã QR dán ở quầy, không qua app.

  Ba điều trang này cố ý làm, đều vì người đọc đang đứng ngoài phố với
  một bàn tay cầm điện thoại:
  · câu "người bán tự lập, Nón Lá không kiểm" đứng NGAY dưới tên quán,
    không nằm ở chân trang — một dòng đính chính ở chân trang là dòng
    người ta đọc sau khi đã tin con số;
  · tên tiếng Việt luôn đứng cạnh tên đã dịch, để khách chỉ tay được;
  · món bán theo cân không có tổng khi chưa nhập số gam.
  Toàn bộ dữ liệu nằm sau dấu # — trình duyệt không gửi nó lên máy chủ.
-->
<style>
:root{
  --ngoc:#1F8A70; --ngoc-sau:#0E4A3C; --son:#B0201A; --vang:#C9A227; --dong-chu:#7D5F0E;
  --giay:#FBF7EC; --tam:#FFFDF7; --then:#0E2B24; --muc:#1D2A24; --muc-nhat:#5F6E64;
  --line:#E2D9C4; --r:16px;
  --chu:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",
        "PingFang SC","Microsoft YaHei","Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--chu);background:var(--giay);color:var(--muc);font-size:16px;line-height:1.5;
  padding-bottom:calc(120px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--vang);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.tnum{font-variant-numeric:tabular-nums}

.langs{display:flex;gap:6px;flex-wrap:wrap;padding:14px 0 6px}
.langs button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--tam);
  font-size:14px;font-weight:600;min-height:36px}
.langs button[aria-pressed="true"]{background:var(--then);color:#fff;border-color:var(--then)}

.head{padding:10px 0 4px}
.kicker{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dong-chu)}
h1{font-size:28px;line-height:1.15;margin:4px 0 2px;letter-spacing:-.01em}
.where{color:var(--muc-nhat);font-size:15px}
.note{margin:12px 0 4px;padding:12px 14px;border-radius:12px;background:#F3EEDF;border:1px solid var(--line);
  font-size:15px}
.note b{display:block;font-size:14px;color:var(--muc-nhat);font-weight:600;margin-top:4px}
.fee{margin:8px 0 0;font-size:15px;font-weight:600}

.list{list-style:none;margin:14px 0 0;display:grid;gap:10px}
.item{background:var(--tam);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.name{font-size:18px;font-weight:700;line-height:1.25}
.vi{font-size:15px;color:var(--muc-nhat)}
.price{text-align:right;white-space:nowrap}
.price b{font-size:19px}
.unit{display:block;font-size:14px;color:var(--muc-nhat);white-space:normal;max-width:150px}
.ask{margin-top:8px;font-size:14px;color:var(--dong-chu);font-weight:600}
.qty{display:flex;align-items:center;gap:8px;margin-top:10px}
.qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:22px;font-weight:600}
.qty output{min-width:34px;text-align:center;font-size:18px;font-weight:700}
.qty input{width:110px;height:44px;border-radius:12px;border:1px solid var(--line);padding:0 10px;font-size:17px;background:#fff}
.qty .g{font-size:15px;color:var(--muc-nhat)}
.qty .sub{margin-left:auto;font-weight:700}
.foot{margin:18px 0;font-size:14px;color:var(--muc-nhat)}
.foot p+p{margin-top:6px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--then);color:#fff;
  padding:12px 0 calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 24px rgba(0,0,0,.12)}
.bar .wrap{display:flex;align-items:center;gap:12px}
.bar .t small{display:block;font-size:14px;opacity:.8}
.bar .t b{font-size:22px}
.bar button{margin-left:auto;background:var(--vang);color:var(--then);font-weight:700;border-radius:12px;
  padding:0 16px;min-height:48px;font-size:16px}
.bar button:disabled{opacity:.45;cursor:default}

.empty{padding:60px 0;text-align:center}
.empty h1{font-size:24px}
.empty p{color:var(--muc-nhat);margin-top:8px}
.empty a{display:inline-block;margin-top:18px;color:var(--ngoc-sau);font-weight:700}

/* Màn cho người bán: lật 180° để người đứng đối diện đọc xuôi. */
.flip{position:fixed;inset:0;background:#fff;z-index:50;display:none;flex-direction:column}
.flip.on{display:flex}
.flip .doc{flex:1;overflow:auto;padding:24px 20px;transform:rotate(180deg)}
.flip .doc.xuoi{transform:none}
.flip h2{font-size:22px;margin-bottom:8px}
.flip p.l{font-size:17px;margin-bottom:14px}
.flip table{width:100%;border-collapse:collapse;font-size:19px}
.flip td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.flip td:last-child{text-align:right;white-space:nowrap;font-weight:700}
.flip .sum td{font-size:24px;border-bottom:0;padding-top:14px}
.flip .ctl{display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--then)}
.flip .ctl button{flex:1;min-height:48px;border-radius:12px;background:#fff;color:var(--then);font-weight:700}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<div class="bar" id="bar" hidden><div class="wrap">
  <div class="t"><small id="tongNhan"></small><b class="tnum" id="tong">0₫</b></div>
  <button id="xem" disabled></button>
</div></div>
<section class="flip" id="flip" role="dialog" aria-modal="true" aria-label="Cho người bán xem">
  <div class="doc" id="flipDoc"></div>
  <div class="ctl"><button id="xoay">⟲ Xoay / Rotate</button><button id="dong">✕</button></div>
</section>

<script type="module">
import * as BG from "../biengia.js";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TEN_NN = { en: "English", ko: "한국어", zh: "中文", ja: "日本語", vi: "Tiếng Việt" };

let lang = BG.doanNgonNgu(navigator.language);
try { lang = localStorage.getItem("nl.bg.lang") || lang; } catch {}
let bang = null;
const chon = new Map();          // idx → số lượng (hoặc số gam với món theo cân)

async function nap() {
  const goi = BG.layGoi(location.hash);
  if (!goi) return veTrong();
  try { bang = await BG.moGoi(goi); } catch { return veTrong(true); }
  ve();
}

function veTrong(hong = false) {
  $("#app").innerHTML = `<div class="empty">
    <h1>${hong ? "This price list could not be read" : "No price list here"}</h1>
    <p>${hong ? "The code may be damaged or cut off. Ask the seller for the paper list."
               : "Scan the code on the seller’s sign to see their prices."}</p>
    <a href="tao-bang-gia.html">Bạn bán hàng? Lập bảng giá song ngữ miễn phí →</a></div>`;
}

function ngay(d) {
  const [y, m, dd] = String(d || "").split("-").map(Number);
  if (!y) return "";
  return new Date(Date.UTC(y, m - 1, dd)).toLocaleDateString(lang === "vi" ? "vi-VN" : lang, { dateStyle: "long", timeZone: "UTC" });
}

function ve() {
  document.documentElement.lang = lang;
  const phiDong = bang.f > 0
    ? `${esc(BG.cau("phi", lang))}: ${bang.f}%`
    : esc(BG.cau("daGom", lang));
  $("#app").innerHTML = `
    <nav class="langs" aria-label="Language">${BG.NGON_NGU.map((l) =>
      `<button data-l="${l}" aria-pressed="${l === lang}">${TEN_NN[l]}</button>`).join("")}</nav>
    <header class="head">
      <div class="kicker">${esc(BG.cau("tieuDe", lang))}${lang !== "vi" ? " · Bảng giá" : ""}</div>
      <h1>${esc(bang.n)}</h1>
      ${bang.a ? `<div class="where">${esc(bang.a)}</div>` : ""}
      <div class="note" data-k="laLoiKhai">${esc(BG.cau("laLoiKhai", lang))}
        <b>${esc(BG.cau("ngayLap", lang))}: ${esc(ngay(bang.d))} · ${esc(BG.cau("motGia", lang))}</b></div>
      <p class="fee">${phiDong}</p>
    </header>
    <ul class="list">${bang.i.map(veDong).join("")}</ul>
    <div class="foot">
      ${["ko", "zh", "ja"].includes(lang) && !BG.DUYET_BAN_DICH ? `<p>${esc(BG.cau("chuaDuyet", lang))}</p>` : ""}
      <p>Nón Lá · <a href="tao-bang-gia.html">Lập bảng giá cho quầy của bạn</a></p>
    </div>`;
  $("#bar").hidden = false;
  $("#xem").textContent = BG.cau("choXem", lang);
  $("#tongNhan").textContent = BG.cau("tong", lang);
  capNhat();
}

function veDong(d, idx) {
  const t = BG.tenMon(d, lang);
  const dv = BG.DON_VI[d.u] || {};
  const thoiGia = d.u === "thoigia";
  const sl = chon.get(idx) || 0;
  const gia = thoiGia ? "—" : BG.vnd(d.g);
  let dieuKhien;
  if (thoiGia) {
    dieuKhien = `<p class="ask">${esc(BG.cau("hoiGia", lang))}</p>
      <div class="qty"><button data-a="-" data-i="${idx}" aria-label="−">−</button>
        <output data-o="${idx}">${sl}</output><button data-a="+" data-i="${idx}" aria-label="+">+</button></div>`;
  } else if (dv.can) {
    dieuKhien = `<p class="ask">${esc(BG.cau("hoiCan", lang))}</p>
      <div class="qty"><input inputmode="numeric" pattern="[0-9]*" data-g="${idx}" value="${sl || ""}"
        placeholder="0" aria-label="grams"><span class="g">g</span>
        <span class="sub tnum" data-s="${idx}"></span></div>`;
  } else {
    dieuKhien = `<div class="qty"><button data-a="-" data-i="${idx}" aria-label="−">−</button>
      <output data-o="${idx}">${sl}</output><button data-a="+" data-i="${idx}" aria-label="+">+</button>
      <span class="sub tnum" data-s="${idx}"></span></div>`;
  }
  return `<li class="item"><div class="row">
      <div><div class="name">${esc(t.chinh)}</div>${t.vi !== t.chinh ? `<div class="vi" lang="vi">${esc(t.vi)}</div>` : ""}</div>
      <div class="price"><b class="tnum">${gia}</b><span class="unit">${esc(BG.nhanDonVi(d.u, lang))}</span></div>
    </div>${dieuKhien}</li>`;
}

function capNhat() {
  const r = BG.tinhTong(bang, [...chon].map(([idx, sl]) => ({ idx, sl })));
  $("#tong").textContent = BG.vnd(r.tong);
  document.querySelectorAll("[data-s]").forEach((el) => {
    const d = r.dong.find((x) => x.idx === Number(el.dataset.s));
    el.textContent = d ? BG.vnd(d.tien) : "";
  });
  $("#xem").disabled = !r.dong.length && !r.conHoi.length;
  return r;
}

$("#app").addEventListener("click", (e) => {
  const l = e.target.closest("[data-l]");
  if (l) { lang = l.dataset.l; try { localStorage.setItem("nl.bg.lang", lang); } catch {} return ve(); }
  const b = e.target.closest("[data-a]");
  if (!b) return;
  const idx = Number(b.dataset.i);
  const sl = Math.max(0, Math.min(99, (chon.get(idx) || 0) + (b.dataset.a === "+" ? 1 : -1)));
  sl ? chon.set(idx, sl) : chon.delete(idx);
  document.querySelector(`[data-o="${idx}"]`).textContent = sl;
  capNhat();
});
$("#app").addEventListener("input", (e) => {
  const el = e.target.closest("[data-g]");
  if (!el) return;
  const g = Math.min(20000, Number(String(el.value).replace(/\D/g, "")) || 0);
  g ? chon.set(Number(el.dataset.g), g) : chon.delete(Number(el.dataset.g));
  capNhat();
});

/* Màn cho người bán: TIẾNG VIỆT, không phán xét — chỉ những gì khách đã
   chọn và phép tính theo chính bảng giá của quán. */
$("#xem").addEventListener("click", () => {
  const r = capNhat();
  const dong = r.dong.map((x) => {
    const d = bang.i[x.idx];
    const sl = x.theoCan ? `${x.sl} g` : `${x.sl} ×`;
    return `<tr><td>${sl} ${esc(BG.tenMon(d, "vi").vi)}<br><small>${esc(BG.vnd(d.g))} / ${esc(BG.nhanDonVi(d.u, "vi"))}</small></td><td>${BG.vnd(x.tien)}</td></tr>`;
  }).join("") + r.conHoi.map((x) =>
    `<tr><td>${chon.get(x.idx)} × ${esc(BG.tenMon(bang.i[x.idx], "vi").vi)}</td><td>hỏi giá</td></tr>`).join("");
  $("#flipDoc").innerHTML = `<h2>${esc(bang.n)}</h2><p class="l">${esc(BG.CAU.nguoiBanDoc)}</p>
    <table>${dong}${r.phi ? `<tr><td>Phụ thu ${bang.f}%</td><td>${BG.vnd(r.phi)}</td></tr>` : ""}
    <tr class="sum"><td>Tổng theo bảng giá</td><td>${BG.vnd(r.tong)}</td></tr></table>
    ${r.conHoi.length ? `<p class="l" style="margin-top:12px">Chưa cộng món thời giá.</p>` : ""}`;
  $("#flipDoc").classList.remove("xuoi");
  $("#flip").classList.add("on");
});
$("#xoay").addEventListener("click", () => $("#flipDoc").classList.toggle("xuoi"));
$("#dong").addEventListener("click", () => $("#flip").classList.remove("on"));
addEventListener("hashchange", nap);
nap();
</script>
</body>
</html>
