<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Place — Nón Lá</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="web.css">
</head>
<body>
<main class="wrap" id="main">
  <nav class="crumb" id="crumb"></nav>
  <div id="page"></div>
</main>

<script type="module">
import { chrome, paintZoneName, load, I, esc, money, km, distance, photo,
         placePhoto, dishPhoto, verdictPill, signedIn, gate, dichTrang, tf } from "./web.js";
import { t as T } from "../i18n.js";

chrome("place.html");
dichTrang();
paintZoneName();

const id = new URLSearchParams(location.search).get("id");
const [places, prices, dishes, maps, famous] = await Promise.all([
  load("places"), load("prices"), load("dishes"), load("maps"),
  load("famous").catch(() => ({ places: [] }))]);

const fam = (famous.places || []).find((x) => x.id === id);
let p = places.places.find((x) => x.id === id);

if (fam) {
  // Tìm zone gần nhất dựa trên khoảng cách nếu nằm ngoài bbox
  const findClosestZone = (at) => {
    if (!at) return "hoian-oldtown";
    let best = "hoian-oldtown", minD = Infinity;
    for (const [zid, z] of Object.entries(maps.zones)) {
      const d = Math.hypot(at[0] - z.center[0], at[1] - z.center[1]);
      if (d < minD) { minD = d; best = zid; }
    }
    return best;
  };

  const zid = fam.zone || p?.zone || Object.entries(maps.zones).find(([, z]) => {
    if (!fam.at) return false;
    const [[n, w], [s, e]] = z.bbox;
    const margin = 0.05;
    return fam.at[0] <= n + margin && fam.at[0] >= s - margin && fam.at[1] >= w - margin && fam.at[1] <= e + margin;
  })?.[0] || findClosestZone(fam.at);

  p = {
    ...(p || {}),
    id: fam.id,
    name: fam.name || p?.name,
    zone: zid,
    at: fam.at || p?.at,
    street: fam.street || p?.street || "",
    tier: p?.tier || (fam.dish?.startsWith("ca-phe") ? "cafe" : (/nhà hàng|restaurant/i.test(fam.street || "") ? "restaurant" : "street")),
    known: [...new Set([...(p?.known || []), fam.dish].filter(Boolean))],
    note: fam.note || p?.note || "",
    source: fam.source || p?.source || "",
    phone: fam.phone || p?.phone || "",
    photo: fam.photo || p?.photo || "",
    mapsUrl: fam.mapsUrl || p?.mapsUrl || "",
    rating: fam.rating ?? p?.rating,
    reviews: fam.reviews ?? p?.reviews,
    famous: true,
  };
}
const page = document.getElementById("page");

if (!p) {
  page.innerHTML = `<div class="empty" style="margin:40px 0 60px"><b>${T("No such place")}</b>
    <p>${T("That link points at a place this build does not carry. Open the map and pick one.")}</p>
    <a class="btn pri" style="margin-top:16px" href="map.html">${T("Open the map")}</a></div>`;
} else {
  const zone = prices.zones[p.zone];
  const geo = maps.zones[p.zone];
  const dishOf = (k) => dishes.dishes.find((d) => d.id === k);

  document.getElementById("crumb").innerHTML =
    `<a href="index.html">${T("Explore")}</a>${I.chevron}<a href="map.html">${T("Tracked spots")}</a>${I.chevron}
     <span>${esc(p.name)}</span>`;
  document.title = `${p.name} — Nón Lá`;

  /* Thanh so giá: vị trí của quán trên dải p25–p95 của CHÍNH vùng đó.
     Không có món nào có giá thì không vẽ thanh — một thanh trống trông
     như dữ liệu bị mất chứ không như "chưa đo". */
  const priced = Object.entries(p.prices || {})
    .map(([k, v]) => ({ k, v, it: zone.items[k] })).filter((x) => x.it);
  const lead = priced[0];
  let meter = "";
  if (lead) {
    const { it, v } = lead;
    const lo = it.p25, hi = it.p95;
    const pct = Math.max(2, Math.min(98, ((v - lo) / Math.max(1, hi - lo)) * 100));
    const inside = v <= it.p75;
    meter = `
      <div class="panel pad" style="margin-top:18px">
        <div class="sect-head">
          <h2>${T("Price check")}</h2>
          <span class="more" style="cursor:default">${inside
            ? `<span class="pill ok soft">${I.shield}${T("Inside local range")}</span>`
            : `<span class="pill bad">${I.alert}${T("Above the local range")}</span>`}</span>
        </div>
        <p class="small muted">${tf("{dish} here vs what {zone} usually pays", { dish: esc(dishOf(lead.k)?.vi || lead.k), zone: esc(zone.en || zone.name) })}</p>
        <div class="meter">
          <div class="bar"><span class="dot" style="left:${pct}%"></span></div>
          <div class="ends">
            <span>${tf("low {v}", { v: money(lo) })}</span>
            <span><b>${tf("this place {v}", { v: money(v) })}</b></span>
            <span>${tf("high {v}", { v: money(hi) })}</span>
          </div>
        </div>
        <p class="small muted" style="margin-top:12px">${tf("Ranges come from seed data for {zone}, updated {date}. A price inside the range is not a promise the food is good — only that the number is normal here.", { zone: esc(zone.en || zone.name), date: esc(zone.updated || "") })}</p>
      </div>`;
  }

  const near = places.places
    .filter((x) => x.zone === p.zone && x.id !== p.id && x.at && p.at)
    .map((x) => ({ x, m: distance(p.at, x.at) }))
    .sort((a, b) => a.m - b.m).slice(0, 4);

  const sights = (geo?.landmarks || [])
    .filter((l) => l.at && l.note && !l.an && p.at && distance(p.at, l.at) < 400)
    .slice(0, 3);

  page.innerHTML = `
  <div class="detail" style="padding-bottom:40px">
    <div>
      <div class="dhero">
        ${photo(placePhoto(p), p.photo ? p.name : `Illustration, not a photo of ${p.name}`, "bg")}
        <div class="inner">
          <h1>${esc(p.name)}</h1>
          <p class="muted" style="margin-top:8px">${I.pin} ${esc(p.street || (p.ganPho ? `near ${p.ganPho}` : ""))} ·
            ${esc(p.tier)} · <small>${p.photo ? (p.source ? esc(p.source) : esc(p.name)) : T("illustration, not a photo of this place")}</small></p>
          <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            ${verdictPill()}
            ${p.rating ? `<span class="pill ok soft" style="font-weight:600">⭐ ${p.rating} · ${(p.reviews || 0).toLocaleString()} ${T("reviews")} ${T("on Google")}</span>` : ""}
          </div>
          <div class="facts">
            ${p.rating ? `<div class="fact"><b>⭐ ${p.rating} Google Maps</b>
              <p>${(p.reviews || 0).toLocaleString()} ${T("reviews")}${p.mapsUrl ? ` · <a href="${esc(p.mapsUrl)}" target="_blank" rel="noopener noreferrer">${T("Google Maps")}</a>` : ""}</p></div>` : ""}
            <div class="fact"><b>${I.bowl}${T("Known for")}</b>
              <p>${(p.known || []).map((k) => esc(dishOf(k)?.vi || k)).join(" · ") || "—"}</p></div>
            <div class="fact"><b>${I.clock}${T("Typical price")}</b>
              <p>${lead ? tf("{a} – {b} for {dish}", { a: money(lead.it.p25), b: money(lead.it.p75), dish: esc(dishOf(lead.k)?.vi || lead.k) }) : T("No priced dish recorded here yet.")}</p></div>
            <div class="fact"><b>${I.pin}${T("Where")}</b>
              <p>${esc(p.street)}, ${esc((zone.en || zone.name).replace(" · ", ", "))}.
                ${T("Coordinates are approximate placements on the named street.")}</p></div>
          </div>
        </div>
      </div>

      ${meter}

      <div class="panel pad" style="margin-top:18px">
        <div class="sect-head"><h2>${T("Signature dishes")}</h2>
          <a class="more" href="scan.html">${T("Check a menu")}</a></div>
        <div class="dishes3">
          ${(p.known || []).map((k) => {
            const d = dishOf(k), it = zone.items[k], mine = (p.prices || {})[k];
            if (!d) return "";
            return `<article class="dish">
              <span class="ph">${photo(dishPhoto(d.id), d.vi)}</span>
              <span>
                <h4>${esc(d.vi)}</h4>
                <span class="amt">${money(mine ?? it?.p50)}</span>
                <p>${esc(d.en)}${it ? ` · ${tf("local {a}–{b}", { a: money(it.p25), b: money(it.p75) })}` : ""}</p>
              </span></article>`;
          }).join("") || `<p class="muted">${T("No dish recorded for this place yet.")}</p>`}
        </div>
      </div>

      ${sights.length ? `<div class="panel pad" style="margin-top:18px">
        <div class="sect-head"><h2>${T("Sights within 400 m")}</h2></div>
        <div class="dishes3">
          ${sights.map((l) => `<article class="dish">
            <span class="ph">${photo(`../assets/sights/${l.img}.jpg`, l.n)}</span>
            <span><h4>${esc(l.n)}</h4>
              <p>${esc(l.note).slice(0, 90)}…</p></span></article>`).join("")}
        </div></div>` : ""}
    </div>

    <aside style="display:flex;flex-direction:column;gap:18px">
      <div class="panel pad">
        <h3 style="font-size:19px">${T("Save this spot")}</h3>
        ${signedIn() ? `<p class="small muted" style="margin:8px 0 14px">${T("Saved spots sit in your journal and follow your account.")}</p>
          <button class="btn pri wide" id="saveBtn">${I.bookmark}${T("Save to my journal")}</button>`
          : `<p class="small muted" style="margin:8px 0 14px">${T("Saving a place writes it into your journal, so it needs an account to write into.")}</p>
          <a class="btn pri wide" href="login.html">${I.lock}${T("Log in to save")}</a>`}
      </div>

      <div class="panel pad">
        <h3 style="font-size:19px">${T("Report a price")}</h3>
        <p class="small muted" style="margin:8px 0 14px">${T("Paid something different? The scan history is what moves the range — reports without a scan do not.")}</p>
        <a class="btn sec wide" href="scan.html">${I.scan}${T("Scan the menu here")}</a>
      </div>

      <div class="panel pad">
        <div class="sect-head"><h2 style="font-size:19px">${T("Nearby tracked spots")}</h2></div>
        <div class="rowlist">
          ${near.map(({ x, m }) => `<a href="place.html?id=${encodeURIComponent(x.id)}">
            <span class="avatar" style="background:var(--kem);color:var(--dong-chu)">${esc(x.name.slice(0, 1))}</span>
            <span><b style="font-size:14.5px">${esc(x.name)}</b>
              <span class="small muted" style="display:block">${esc(x.street)}</span></span>
            <span class="amt">${km(m)}</span></a>`).join("")}
        </div>
      </div>
    </aside>
  </div>`;

  /* Lưu vào cùng khoá localStorage mà app dùng, để hai bản không có hai
     danh sách "đã lưu" khác nhau trên cùng một máy. */
  if (signedIn()) {
  const KEY = "nl.saved";
  const saved = () => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; } };
  const btn = document.getElementById("saveBtn");
  const sync = () => {
    const on = saved().includes(p.id);
    btn.innerHTML = `${I.bookmark}${on ? T("Saved to journal") : T("Save to my journal")}`;
    btn.className = `btn wide ${on ? "sec" : "pri"}`;
  };
  btn.onclick = () => {
    const list = saved();
    const i = list.indexOf(p.id);
    if (i >= 0) list.splice(i, 1); else list.push(p.id);
    localStorage.setItem(KEY, JSON.stringify(list));
    sync();
  };
  sync();
  }
}
</script>
</body>
</html>
